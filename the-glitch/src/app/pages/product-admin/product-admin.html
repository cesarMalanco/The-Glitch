<div class="admin-container py-4">
    <div class="container">

        <!-- HEADER - PAGE TITTLE-->
        <div class="admin-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="title-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <div>
                    <h2 class="admin-title mb-0">Panel de Administración</h2>
                    <p class="admin-subtitle">Gestiona tu catálogo de productos</p>
                </div>
            </div>
            <button class="btn btn-success btn-lg fw-bold d-flex align-items-center gap-2 add-btn btnAdd" (click)="prepareAdd()" *ngIf="!showForm">
                <i class="bi bi-plus-circle"></i>
                Nuevo Producto
            </button>
        </div>

        <!-- FORM WHEN THE ADMIN IS EDITING OR ADDING A PRODUCT-->
        <div *ngIf="showForm" class="form-card mt-4">
            <div class="form-card-header d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2 table-tittle-header">
                    <i class="bi" [class.bi-pencil-square]="editingProduct" [class.bi-plus-circle-fill]="!editingProduct"></i>
                    <h5 class="mb-0"> {{ editingProduct ? 'Editar' : 'Agregar' }} Producto</h5>
                </div>
                <button class="btn btn-sm btn-danger" (click)="showForm = false">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <!-- FORM -->
            <div class="p-4">
                <app-product-form-reactive [initialData]="editingProduct" (onSave)="handleSave($event)"></app-product-form-reactive>
            </div>
        </div>

        <!-- TABLE WITH ALL THE PRODUCTS -->
        <div class="table-container mt-4"  *ngIf="!showForm">

            <div class="table-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="table-title d-flex align-items-center gap-2">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    <span>Lista de Productos</span>
                </div>
                <div *ngIf="products | async as productList">
                    <span class="badge bg-success-subtle text-success">
                        <i class="bi bi-box-seam"></i>
                        {{ productList.length }} productos
                    </span>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle product-table mb-0">
                    <thead class="table-dark">
                        <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="text-center">Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let p of products | async">
                            <td class="id-cell">#{{p.id}}</td>

                            <td class="fw-semibold">
                                {{p.name}}
                            </td>
                            <td>
                                <span class="category-badge">
                                {{p.category}}
                                </span>
                            </td>
                            <td class="price-cell">
                                {{p.price | currency}}
                            </td>

                            <td>
                                <span class="stock-badge" [class.low-stock]="p.stock <= 5" [class.out-stock]="p.stock <= 0">
                                <i class="bi"
                                    [class.bi-check-circle-fill]="p.stock > 5"
                                    [class.bi-exclamation-triangle-fill]="p.stock <= 5 && p.stock > 0"
                                    [class.bi-x-circle-fill]="p.stock <= 0">
                                </i>
                                {{p.stock}}
                                </span>
                            </td>

                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-success me-1" (click)="prepareEdit(p)">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(p.id)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
